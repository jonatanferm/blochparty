[project]
name = "blochparty"
version = "0.1.0"
description = "Differentiable MRI simulator in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
anatomy = ["nibabel>=5"]  # optional NIfTI reader for locally supplied QSM Challenge maps
pulseq = ["pypulseq>=1.5"]  # read_pulseq
mrzero = ["MRzeroCore>=1.1"]  # validation/mrzero/compare_mrzero.py and the crosscheck tests
io = ["ismrmrd>=1.14", "h5py>=3"]  # io.write_dataset / read_dataset (ISMRMRD HDF5)

[dependency-groups]
# finufft: radial reconstruction in validation/real (benchmark 3)
dev = ["pytest", "scipy", "matplotlib", "pypulseq>=1.5", "finufft>=2.5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["crosscheck: cross-simulator agreement with MRzero (opt-in: pytest -m crosscheck)",
           "slow: over ~1 s; pytest -m 'not slow' is the quick subset for iterating (under a minute)"]
addopts = "-m 'not crosscheck' --import-mode=importlib"
# helpers.py and cases.py (tests/), and the example and validation scripts the tests import
pythonpath = ["tests", "validation/mrzero", "validation/real", "validation/realism", "validation/anatomy"]

[tool.ruff]
line-length = 120
extend-exclude = ["validation/real/data", "validation/anatomy/data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",          # long lines: the formatter sets the code's width; long strings, URLs and table rows stay whole
    "E701", "E702",  # several short statements on one line where they read as one step (x = 1; y = 2)
    "E731",          # one-line lambdas assigned to names, the codebase's local helpers
    "E741",          # l, I, O as names where the mathematics uses them
    "B007",          # loop variables kept for the reader although unused
    "B023",          # closures defined in a loop are called within that iteration (every case checked, 2026-10-17)
    "B905",          # zip without strict=: the lengths are equal by construction
]

[tool.ruff.lint.isort]
known-first-party = ["blochparty"]
known-local-folder = ["cases", "helpers"]
