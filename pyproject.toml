[project]
name = "blochparty"
version = "0.1.0"
description = "Differentiable MRI simulator in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
pulseq = ["pypulseq>=1.5"]  # read_pulseq
mrzero = ["MRzeroCore>=1.1"]  # validation/compare_mrzero.py and the crosscheck tests

[dependency-groups]
dev = ["pytest", "scipy", "matplotlib", "ninja", "pypulseq>=1.5"]  # ninja: builds blochparty.fused

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["crosscheck: cross-simulator agreement with MRzero (opt-in: pytest -m crosscheck)"]
addopts = "-m 'not crosscheck'"
