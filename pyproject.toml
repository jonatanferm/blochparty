[project]
name = "blochparty"
version = "0.1.0"
description = "Differentiable MRI simulator in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy"]

[dependency-groups]
dev = ["pytest", "scipy", "matplotlib", "ninja"]  # ninja: builds blochparty.fused

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
